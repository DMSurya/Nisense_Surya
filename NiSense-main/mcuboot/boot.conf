# =============================================================================
# MCUBoot Boot Configuration
# =============================================================================
# Target: nRF52840 (Raytac MDBT50Q-DB-40)
# 
# OTA Flow:
#   1. New image downloaded to Slot1 (external flash, 0x00000-0x80000)
#   2. MCUBoot validates signature
#   3. Atomic swap: Slot0 <-> Slot1 using scratch (0x80000-0x81000)
#   4. On failure, fallback to Slot2 (external, 0x81000-0x181000)
# =============================================================================

[flash]
# Primary slot: Internal flash Slot0 (expanded to 896 KB)
primary_slot_offset = 0x08000
primary_slot_size = 0xE0000

# Secondary slot: External flash Slot1 (OTA staging)
secondary_slot_offset = 0x81000
secondary_slot_size = 0x100000

# Scratch partition: External flash (atomic swap buffer)
scratch_offset = 0x80000
scratch_size = 0x1000

[mcuboot]
# Swap mode: Use scratch partition for atomic swaps
swap_mode = SCRATCH

# Signature algorithm: RSA-2048
sign_algorithm = RSA-2048
hash_algorithm = SHA-256

# Security: Enable rollback protection and downgrade prevention
rollback_enabled = 1
downgrade_prevention = 1

# Boot slot selection: Try Slot0 first, fallback to Slot2 on failure
boot_slot_select = PRIORITY_SLOT0
