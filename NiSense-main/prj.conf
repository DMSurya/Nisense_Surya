################################################################################
# Project Configuration for MAX20360 PMIC + MAX32664 Sensor Hubs
# Target: nRF52840 (Raytac MDBT50Q-DB-40)
# Zephyr: v4.3.99 (NCS v3.3.0)
#
# This file is organized into logical sections with detailed descriptions.
# Each block is grouped by subsystem or feature for clarity and maintainability.
################################################################################
# Boot timing and banner — moved to conf/core/bootloader.conf

################################################################################
# 1. BOOTLOADER CONFIGURATION
#    - Moved to conf/core/bootloader.conf (always included — core overlay)
#    - Covers MCUboot, IMG_MANAGER=n, MCUMGR=n, PM static partitioning
################################################################################

################################################################################
# 2. MEMORY & STACK CONFIGURATION
#    - Moved to conf/core/memory.conf (always included — core overlay)
#    - Covers FPU, stack sizes, heap, and thread stack tuning
################################################################################

################################################################################
# 3. APPLICATION FEATURES
#    - High-level feature toggles (RTT logging, measurements)
#    - All APP_FEATURE_* toggles are grouped first
#    - Feature-specific customization follows in per-feature blocks
################################################################################
CONFIG_APP_FEATURE_RTT_LOG=y
CONFIG_APP_FEATURE_FAULT_DEBUG=y
CONFIG_APP_FEATURE_SHELL=n
CONFIG_APP_FEATURE_DISPLAY=y
# Fonts only: XIP TinyTTF (prod) vs compiled Montserrat (debug / low-RAM).
# CONFIG_APP_FONT_PROFILE_RESOURCE_RUNTIME=y
CONFIG_APP_FONT_PROFILE_SAFE_COMPILED=y
CONFIG_APP_FEATURE_MAX32664=y
# MAX3010x built alongside hub so runtime product_hw_detect can bind Pulse SKU
CONFIG_APP_FEATURE_MAX3010X=y
CONFIG_APP_FEATURE_PPG=y
CONFIG_APP_FEATURE_FILE_SYSTEM=n
CONFIG_APP_FEATURE_CONFIG_PERSIST=y
CONFIG_APP_FEATURE_GLUCOSE=y
# Wi-Fi hold: BLE-only sync while SoftAP/bulk path is investigated.
CONFIG_APP_FEATURE_WIFI=n
CONFIG_APP_FEATURE_BLE=y
# Shell selects USB; keep explicit =y when shell is on (documents dependency).
CONFIG_APP_FEATURE_USB=n
CONFIG_APP_FEATURE_SYSTEMVIEW=n
CONFIG_APP_FEATURE_MAX32664_UPDATE=n
CONFIG_APP_FEATURE_DIAG_MONITOR=n
CONFIG_APP_FEATURE_BLE_DFU=y

# RTT Logging Feature
# Feature-specific overrides are kept in conf/features/*.conf
# and can be applied when building with EXTRA_CONF_FILE.

# HR / SpO2 Features
# Automatically enabled based on MAX3010x sensor variant in device tree:
#   MAX30101/30102/30105: SpO2 + HR both enabled by default
# SpO2 re-enabled after RAM savings from right-sizing glucose_workq stacks
# (~6 KB freed) — measured incremental cost on top of HR: ~+3 KB flash,
# ~+1 KB RAM (extra channel buffers + UI screen).
# PPG workqueue and algorithm settings moved to conf/features/ppg.conf

# Wi-Fi Feature
# UI_SCREEN_WIFI moved to conf/features/wifi.conf

# BLE Feature
# UI_SCREEN_BLE moved to conf/features/ble.conf

# MAX32664 Firmware Update Feature

# Diagnostics Feature (master only — overlays in conf/features/diag_monitor.conf)
# Kconfig tuning: Kconfig.diag_monitor

