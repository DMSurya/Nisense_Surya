# Board-specific configuration for Raytac MDBT50Q-DB-40
# This file is automatically included when building for this board

# Flash driver for disk access (USB MSC)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# External flash (QSPI NOR) for LittleFS partition
CONFIG_NORDIC_QSPI_NOR=y
