# =============================================================================
# MCUboot Configuration for Sysbuild (NCS v3.0.0+)
# =============================================================================
# This file is automatically picked up by sysbuild when building MCUboot.
# CRITICAL: Keep this MINIMAL - MCUboot partition is only 40KB!
# =============================================================================

# =============================================================================
# BOOT MODE & VALIDATION
# =============================================================================
# BOOT_BOOTSTRAP: Allow MCUboot to boot an image without confirmed trailer
# ESSENTIAL FOR FIRST BOOT - without this, MCUboot refuses to boot freshly flashed images
CONFIG_BOOT_BOOTSTRAP=y

# Validate primary slot at every boot
CONFIG_BOOT_VALIDATE_SLOT0=y

# Watchdog: DISABLED - nRF52840 WDT cannot be stopped once started
# If enabled, MCUboot starts WDT and app MUST feed it continuously
# Since our app doesn't enable WDT, system would reset after ~30 seconds
CONFIG_BOOT_WATCHDOG_FEED=n

# =============================================================================
# FLASH DRIVERS & PARTITIONS
# =============================================================================
# Internal flash
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_JESD216_API=y

# QSPI external flash driver (for secondary OTA slot)
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_NRFX_QSPI=y

# DTS-based partitioning: flash_map entries for external partitions are built
# from the DTS fixed-partitions nodes in the MCUboot board overlay.

# =============================================================================
# RTT CONSOLE (Minimal Configuration)
# =============================================================================
CONFIG_USE_SEGGER_RTT=y
# CONSOLE required for RTT_CONSOLE in NCS v3.3.0+
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y

# Minimal RTT buffer configuration to save RAM/flash
CONFIG_SEGGER_RTT_MAX_NUM_UP_BUFFERS=3
CONFIG_SEGGER_RTT_MAX_NUM_DOWN_BUFFERS=3
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=1024
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=16
CONFIG_SEGGER_RTT_MODE_NO_BLOCK_SKIP=y
CONFIG_SEGGER_RTT_SECTION_CUSTOM=y
CONFIG_SEGGER_RTT_SECTION_CUSTOM_NAME=".rtt_buff_data"
CONFIG_SEGGER_RTT_INIT_MODE_ALWAYS=y

# =============================================================================
# LOGGING (Disabled - Use printk for Banner Only)
# =============================================================================
# Disable full LOG subsystem to save ~6KB flash
# The NCS boot banner uses printk(), not LOG macros, so it still works
CONFIG_LOG=n

# Keep printk enabled for banner output via RTT
# (already enabled above: CONFIG_PRINTK=y, CONFIG_RTT_CONSOLE=y)

# =============================================================================
# SIZE OPTIMIZATION (CRITICAL - Keep Under 40KB!)
# =============================================================================
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_SPEED_OPTIMIZATIONS=n

# BOOT_MAX_IMG_SECTORS: let AUTO mode derive from DTS slot0_partition size
# (968 KB / 4 KB per sector = 242 sectors). BOOT_MAX_IMG_SECTORS_AUTO=y is the
# default in NCS v3.3.0; setting a manual value raises a Kconfig dependency warning.

# Disable unnecessary features to save flash
CONFIG_ASSERT=n
CONFIG_MCUBOOT_INDICATION_LED=n
CONFIG_MPU_STACK_GUARD=n
CONFIG_HW_STACK_PROTECTION=n
CONFIG_TIMESLICING=n
CONFIG_MULTITHREADING=n

# Disable unused subsystems
CONFIG_SYS_CLOCK_EXISTS=n
CONFIG_TIMEOUT_64BIT=n

# Enable NCS boot banner (uses printk, not LOG subsystem)
CONFIG_NCS_BOOT_BANNER=y

# RSA-2048 PSS verification via mbedTLS requires ~3-4KB stack for MPI arithmetic
# 1536 caused silent stack overflow during signature verification → FIH_FAILURE
CONFIG_MAIN_STACK_SIZE=8192
