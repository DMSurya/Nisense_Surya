# =============================================================================
# Sysbuild Configuration - MCUboot Bootloader
# =============================================================================
# This file enables MCUboot bootloader to be built alongside the application
# when using sysbuild. Without this, CONFIG_BOOTLOADER_MCUBOOT only reserves
# partition space but doesn't build the bootloader.
#
# NOTE: Sysbuild-level configs use SB_ prefix. MCUboot-specific configs
# should go in sysbuild/mcuboot.conf (picked up automatically by sysbuild).
# =============================================================================

# Enable MCUboot bootloader build in sysbuild
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Generate board-scoped merged HEX artifacts (merged_<board_target>.hex)
SB_CONFIG_MERGED_HEX_FILES=y

# Disable deprecated Partition Manager — partition layout defined entirely in DTS overlays
# (boards/raytac_overlay/50_memory.overlayinc and 51_qspi.overlayinc)
SB_CONFIG_PARTITION_MANAGER=n

# Signing key file - must be set at sysbuild level
# Use absolute path since relative paths resolve from west workspace root
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="E:/AARMS/HCM/NiSense/mcuboot/root-rsa-2048.pem"

# Keep MCUboot image metadata inside sysbuild/bootloader configuration.
# The main application has IMG_MANAGER disabled, so syncing updateable-image
# metadata into the app produces noisy Kconfig warnings without adding value.
SB_CONFIG_MCUBOOT_APP_SYNC_UPDATEABLE_IMAGES=n

# MCUboot signature type - RSA (key length detected from .pem file)
SB_CONFIG_BOOT_SIGNATURE_TYPE_RSA=y
