org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Legacy KGP opt-out until all plugins support AGP 9 built-in Kotlin (see README).
android.newDsl=false
android.builtInKotlin=false
# Project lives on E: while Pub cache is on C:. Kotlin incremental caches fail with
# "this and base files have different roots" across drive letters — disable them.
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.incremental.js=false
