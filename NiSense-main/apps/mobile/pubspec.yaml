name: hcm
description: HCM wearable companion app (NiSense).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^2.3.10
  permission_handler: ^12.0.3
  provider: ^6.1.5
  flutter_svg: ^2.0.17
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  intl: ^0.20.2
  http: ^1.4.0
  cbor: ^6.3.5
  crypto: ^3.0.6
  archive: ^3.6.1
  file_selector: ^1.1.0
  # Server connectivity (mobile as BLE gateway to the NiSense platform API)
  dio: ^5.5.0
  flutter_appauth: ^7.0.1
  flutter_secure_storage: ^10.0.0
  excel: ^4.0.6
  share_plus: ^13.2.0
  sqflite: ^2.4.2
  path: ^1.9.1
  network_info_plus: ^8.2.1
  wifi_scan: ^0.4.1+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/app.png
  adaptive_icon_background: "#040C24"
  adaptive_icon_foreground: assets/icons/app.png
  min_sdk_android: 29

flutter:
  uses-material-design: true
  assets:
    - assets/svg/
    - assets/icons/app.png
    - assets/icons/icon.png
    - assets/splash.png
