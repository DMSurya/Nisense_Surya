# SystemView feature-specific configuration overlay
# Applied via EXTRA_CONF_FILE when enabling APP_FEATURE_SYSTEMVIEW.
# Provides SEGGER SystemView tracing on RTT channel 1 for performance analysis.

CONFIG_TRACING=y
CONFIG_SEGGER_SYSTEMVIEW=y
CONFIG_SEGGER_SYSTEMVIEW_BOOT_ENABLE=n
CONFIG_SEGGER_SYSVIEW_POST_MORTEM_MODE=n
CONFIG_SEGGER_SYSVIEW_RTT_CHANNEL=1
CONFIG_SEGGER_SYSVIEW_RTT_BUFFER_SIZE=4096
CONFIG_SEGGER_SYSVIEW_APP_NAME="NiSense"

# Readable thread names in the SystemView timeline (not only in diag builds).
CONFIG_THREAD_NAME=y

# NiSense is RTT- and RAM-constrained: default Zephyr tracing enables every hook
# (ISR, work, mutex, net, …) and can flood RTT channel 1 before J-Link drains it.
# Keep a scheduling-focused timeline; re-enable categories in menuconfig if needed.
CONFIG_TRACING_ISR=n
CONFIG_TRACING_WORK=n
CONFIG_TRACING_SEMAPHORE=n
CONFIG_TRACING_MUTEX=n
CONFIG_TRACING_CONDVAR=n
CONFIG_TRACING_QUEUE=n
CONFIG_TRACING_FIFO=n
CONFIG_TRACING_LIFO=n
CONFIG_TRACING_STACK=n
CONFIG_TRACING_MESSAGE_QUEUE=n
CONFIG_TRACING_MAILBOX=n
CONFIG_TRACING_PIPE=n
CONFIG_TRACING_HEAP=n
CONFIG_TRACING_MEMORY_SLAB=n
CONFIG_TRACING_TIMER=n
CONFIG_TRACING_EVENT=n
CONFIG_TRACING_POLLING=n
CONFIG_TRACING_PM=n
CONFIG_TRACING_SYSCALL=n
CONFIG_TRACING_NETWORKING=n
CONFIG_TRACING_GPIO=n
