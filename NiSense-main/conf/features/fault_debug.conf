# Fault-debug feature overlay
# Centralizes crash diagnostics and assertion settings used during
# fault analysis, Ozone debugging, and stack corruption investigation.
#
# Applied via EXTRA_CONF_FILE when enabling APP_FEATURE_FAULT_DEBUG.
# APP_FEATURE_FAULT_DEBUG=y is passed as a CMake -D arg by build_project.ps1.

# ---------------------------------------------------------------------------
# Exception and fault dump diagnostics
# ---------------------------------------------------------------------------
CONFIG_FAULT_DUMP=2
CONFIG_EXCEPTION_DEBUG=y
CONFIG_EXTRA_EXCEPTION_INFO=y

# ---------------------------------------------------------------------------
# Enhanced stack/fault protection and usage visibility
# Note: MPU_STACK_GUARD and STACK_SENTINEL are mutually exclusive.
# ---------------------------------------------------------------------------
CONFIG_MPU_STACK_GUARD=y
CONFIG_HW_STACK_PROTECTION=y
# CONFIG_STACK_SENTINEL=y  # Conflicts with MPU_STACK_GUARD
CONFIG_STACK_USAGE=y
CONFIG_STACK_CANARIES=y
CONFIG_STACK_POINTER_RANDOM=1

# ---------------------------------------------------------------------------
# Kernel assertions (development profile)
# ---------------------------------------------------------------------------
# Disabled: LVGL TinyTTF / stb_truetype uses assert() internally and will
# kernel-panic on glyph-cache edge cases during normal UI work (issue #4).
# STBTT_assert is softened via a build-generated force-include shim; keep
# ASSERT off so picolibc assert() cannot halt the device. Stack guards + fault
# dumps below still catch real overflows and CPU faults.
# CONFIG_ASSERT=y
# CONFIG_ASSERT_LEVEL=2
