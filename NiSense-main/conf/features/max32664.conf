# MAX32664 Sensor Hub feature overlay
# Enables the MAX32664 biometric sensor hub driver (GWEC/GWED variants).
# Supports both MAX32664C (GWEC: MAX86141+LIS2DS12) and MAX32664D (GWED: MAX30101).
# Hub AFE variant is detected at runtime. Product Watch vs Pulse SKU is
# product_hw_detect() (C → Watch; else Pulse). Pair with APP_FEATURE_MAX3010X
# on the unified image so Pulse boards can bind MAX3010x when present.
#
# Applied via EXTRA_CONF_FILE when enabling APP_FEATURE_MAX32664.
# APP_FEATURE_MAX32664=y is passed as a CMake -D arg by build_project.ps1.

# ---------------------------------------------------------------------------
# MAX32664 driver
# ---------------------------------------------------------------------------
CONFIG_MAX32664=y

# ---------------------------------------------------------------------------
# Operating mode: RAW (hub outputs raw sensor data; nRF52840 runs algorithms)
#
# Alternatives:
#   CONFIG_MAX32664_MODE_HUB=y         hub runs WHRM+WSpO2 internally
#   CONFIG_MAX32664_MODE_PASSTHROUGH=y hub as register bridge for diagnostics
# ---------------------------------------------------------------------------
CONFIG_MAX32664_MODE_RAW=y
CONFIG_MAX32664_RAW_PPG_SENSOR=y
CONFIG_MAX32664_RAW_ACCEL_SENSOR=y
CONFIG_LIS2DS12_ACCEL_LOG_LEVEL_INF=y

# ---------------------------------------------------------------------------
# I2C transfer timeout
# At 100 kHz the 8210-byte firmware-update page write takes ~738 ms.
# Root cause of slow bus: missing A-side pull-ups on PCA9306 level shifter.
# Fix: add bias-pull-up in pinctrl (~13 kΩ) or fit 4.7 kΩ external.
# ---------------------------------------------------------------------------
CONFIG_I2C_NRFX_TRANSFER_TIMEOUT=5000

# ---------------------------------------------------------------------------
# Firmware update page-write settings
#   CHUNKED_WRITE=y -> multiple i2c_write() calls, one per chunk (STOP each)
#   CHUNKED_WRITE=n -> single i2c_write() for the full 8198-byte page
# ---------------------------------------------------------------------------
CONFIG_MAX32664_UPDATE_CHUNKED_WRITE=n
CONFIG_MAX32664_UPDATE_PAGE_FLASH_DELAY_MS=680
# Image provenance (Track B): Level 1 name/major allow-list + Level 2 SHA-256
# of ADI 30.13.31 MAX86141 C/Z .msbl. Disable SHA256 only for bring-up.
CONFIG_MAX32664_UPDATE_IMAGE_ALLOWLIST=y
CONFIG_MAX32664_UPDATE_IMAGE_SHA256=y
# Bootloader erase: UG SS_BOOTLOADER_ERASE_DELAY=1400 (not the 3s some flashers use).
CONFIG_MAX32664_UPDATE_ERASE_CMD_DELAY_MS=1400
CONFIG_MAX32664_UPDATE_ERASE_POST_SETTLE_MS=1400
# 0x80 0x06 finalize — omit on bench if UG Table 9 path is preferred.
CONFIG_MAX32664_UPDATE_SEND_FLASH_APP=y

# ---------------------------------------------------------------------------
# Host-fed accelerometer (GWEC / MAX32664C variant with LIS2DS12)
# Required when DT has accel-source="external" (hub does not auto-poll
# LIS2DS12). Feeder reads LIS2DS12 via passthrough and injects Family 0x14
# samples at 25 Hz for WHRM motion rejection.
# Harmless when GWED variant is present — feeder silently finds no LIS2DS12.
# ---------------------------------------------------------------------------
CONFIG_MAX32664_EXTERNAL_ACCEL_FEEDER=y
CONFIG_MAX32664_EXTERNAL_ACCEL_FEED_RATE_HZ=25
CONFIG_MAX32664_EXTERNAL_ACCEL_FEEDER_STACK_SIZE=1536
CONFIG_MAX32664_EXTERNAL_ACCEL_FEEDER_PRIORITY=6
CONFIG_MAX32664_EXTERNAL_ACCEL_FEEDER_LOG_EVERY_N=25

# ---------------------------------------------------------------------------
# Debug / diagnostics (off by default)
# Uncomment for I2C bus tracing during firmware-update debugging.
# ---------------------------------------------------------------------------
CONFIG_MAX32664_I2C_DEBUG_DUMP=n

# RAW FIFO debug controls (summary + payload dump cadence)
# Summary logs: first 10 reads, then every 100 reads
CONFIG_MAX32664_RAW_FIFO_LOG_INITIAL_READS=3
CONFIG_MAX32664_RAW_FIFO_LOG_EVERY_N_READS=100

# Raw payload hex dump (off by default — per-pop LOG_INF stalls 25 Hz sampling)
# Enable only for bring-up via max32664_debug_verbose.conf overlay.
CONFIG_MAX32664_RAW_FIFO_DEBUG_DUMP=n

# Drop ~1 s of FIFO after LED wake (25 frames @ 25 Hz) before algo buffer
CONFIG_MAX32664_RAW_SETTLE_DISCARD_SAMPLES=25

# HUB-mode options (not used in RAW mode, kept for reference)
# CONFIG_MAX32664_HUB_OUTPUT_MODE_ALGO_PLUS_SENSOR=y
# CONFIG_MAX32664_HUB_MODE03_FRAME_BYTES=34

# LED self-test (variant-C HUB init only; RAW mode configures LED path itself)
# CONFIG_MAX32664_LED_SELF_TEST=y
# CONFIG_MAX32664_LED_SELF_TEST_MS=3000
# CONFIG_MAX32664_LED_SELF_TEST_DRIVE=0xFF
