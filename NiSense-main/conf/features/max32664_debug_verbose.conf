# MAX32664 verbose debug overlay
#
# Purpose:
#   High-visibility diagnostics for RAW FIFO sampling behavior.
#   Use this temporarily during bring-up and issue triage.
#
# Recommended use:
#   .\scripts\setup\build_project.ps1 -EnableMax32664VerboseDebug
#
# Notes:
#   - Increases RTT log traffic significantly.
#   - Prefer deferred logging in heavy-debug sessions.

# App-level per-sample visibility
CONFIG_PPG_SAMPLE_LOG_INITIAL_SAMPLES=15
CONFIG_PPG_SAMPLE_LOG_EVERY_N_SAMPLES=1
CONFIG_PPG_PROGRESS_NOTIFY_EVERY_N_SAMPLES=1

# Hub/FIFO summary cadence
CONFIG_MAX32664_RAW_FIFO_LOG_INITIAL_READS=25
CONFIG_MAX32664_RAW_FIFO_LOG_EVERY_N_READS=1

# Raw payload hexdump cadence
CONFIG_MAX32664_RAW_FIFO_DEBUG_DUMP=y
CONFIG_MAX32664_RAW_FIFO_DEBUG_DUMP_INITIAL_READS=25
CONFIG_MAX32664_RAW_FIFO_DEBUG_DUMP_EVERY_N_READS=1

# Optional deep transport tracing (very noisy)
# CONFIG_MAX32664_I2C_DEBUG_DUMP=y
