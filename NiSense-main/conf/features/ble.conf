# BLE feature-specific configuration overlay
# Applied via EXTRA_CONF_FILE when enabling APP_FEATURE_BLE.
# Self-contained: all BLE configs including stack enablement.

# BLE stack and device identity
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="NiSense"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y

# BLE bond persistence (NVS settings backend already enabled in baseline)
CONFIG_BT_SETTINGS=y

# BLE logging (feature-specific)
CONFIG_BT_LOG_LEVEL_WRN=y
CONFIG_BT_HCI_DRIVER_LOG_LEVEL_WRN=y
CONFIG_BT_RPA_LOG_LEVEL_WRN=y

# BLE peripheral role
CONFIG_BT_PERIPHERAL=y

# Security Manager Protocol (SMP)
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SMP_ENFORCE_MITM=y

# Production GATT permission profile (see docs/ble/BLE_DATA_SECURITY_DATABASE.md)
CONFIG_BLE_SECURITY_PROFILE_SECURE=y

# Development-only: add conf/features/ble_open.conf to EXTRA_CONF_FILE to use OPEN profile

# GATT configuration
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_GATT_CLIENT=y

# MTU and data length parameters (125-byte GATT payload support for glucose)
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_USER_DATA_LEN_UPDATE=n

# Request 251-byte LL packets on connect. Without DLE a 244-byte notification is
# split into ~10 x 27-byte link-layer packets, which dominates bulk record sync.
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y

# Bulk record sync keeps several notifications in flight (see ble_record_sync.c).
# One full ATT payload per ACL buffer avoids L2CAP re-fragmentation, and the
# extra buffers let the radio pack multiple packets per connection event.
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=6
CONFIG_BT_L2CAP_TX_BUF_COUNT=6
CONFIG_BT_CONN_TX_MAX=8

# PHY update parameters
CONFIG_BT_PHY_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y

# Peripheral Preferred Connection Parameters (PPCP)
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600

# Bluetooth SIG Current Time Service (date + time + day-of-week)
CONFIG_BT_CTS=y

# UI screen for BLE
CONFIG_UI_SCREEN_BLE=y

# Live PPG/accel GATT streams are lab/debug only. Production sync uses NOR
# pull over Wi-Fi (FULL) or BLE SUMMARY; disabling these frees flash/RAM for
# the WExx bulk path. Re-enable via EXTRA_CONF for desktop monitors.
CONFIG_BLE_PPG_STREAMING=n
CONFIG_BLE_ACCEL_STREAMING=n

# Stack high-watermarks (diag_monitor, BLE connected + notify burst):
#   bt_tx_processor 744/1024. BT RX sized for SMP + CCC subscribe without
#   live PPG/accel streams (those are off in production).
CONFIG_BT_TX_PROCESSOR_STACK_SIZE=1024
CONFIG_BT_RX_STACK_SIZE=3072
