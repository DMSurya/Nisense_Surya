# Wi-Fi feature overlay — production lean STA + HTTP bulk sync
# Applied via EXTRA_CONF_FILE when CONFIG_APP_FEATURE_WIFI=y.
# SoftAP / MQTT / WebSocket / NTP / socket / Wi-Fi UI stay off to protect RAM.

CONFIG_UI_SCREEN_WIFI=n

# ---------------------------------------------------------------------------
# UART (WExx module)
# ---------------------------------------------------------------------------
CONFIG_SERIAL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# ---------------------------------------------------------------------------
# Zephyr Wi-Fi management (offload; no full IP host stack beyond mgmt)
# ---------------------------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=1024

# ---------------------------------------------------------------------------
# Wi-Fi subsystem + WExx driver (sized for bulk sync headroom)
# ---------------------------------------------------------------------------
CONFIG_WIFI=y
CONFIG_WIFI_OFFLOAD=y

CONFIG_WIFI_WEXX=y
CONFIG_WIFI_WEXX_RX_BUF_SIZE=1024
CONFIG_WIFI_WEXX_TX_BUF_SIZE=384
CONFIG_WIFI_WEXX_RESPONSE_TIMEOUT_MS=5000
CONFIG_WIFI_WEXX_CONNECT_TIMEOUT_MS=30000
CONFIG_WIFI_WEXX_MAX_SCAN_RESULTS=4
CONFIG_WIFI_WEXX_RX_THREAD_STACK_SIZE=1536
CONFIG_WIFI_WEXX_WORKQUEUE_STACK_SIZE=1536
CONFIG_WIFI_WEXX_HTTP_RESPONSE_SIZE=512
CONFIG_WIFI_WEXX_LINE_BUF_SIZE=384
CONFIG_WIFI_WEXX_LOG_LEVEL=2

# STA + HTTP only
CONFIG_WIFI_WEXX_HTTP=y
CONFIG_WIFI_WEXX_MQTT=n
CONFIG_WIFI_WEXX_WEBSOCKET=n
CONFIG_WIFI_WEXX_NTP=n
CONFIG_WIFI_WEXX_SOCKET=n
CONFIG_WIFI_WEXX_AP=n
CONFIG_WIFI_WEXX_OTA=n
CONFIG_WIFI_WEXX_FLASH=n
