# BLE open (development) security profile overlay
# Append to EXTRA_CONF_FILE for local protocol work without MITM pairing:
#   west build ... -- -DEXTRA_CONF_FILE=conf/features/ble_open.conf
#
# When using sysbuild / build_project.ps1, pass via NiSense_EXTRA_CONF_FILE instead.

CONFIG_BLE_SECURITY_PROFILE_OPEN=y
# Clears CONFIG_BLE_SECURITY_PROFILE_SECURE via Kconfig choice mutual exclusion.
