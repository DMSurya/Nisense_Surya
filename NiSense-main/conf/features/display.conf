# Display + LVGL + Touch feature overlay
# Enables the ST7789V display, LVGL graphics library, and FT5336 touch input.
# Required by all UI screens and any APP_FEATURE_* that include a UI screen.
#
# Applied via EXTRA_CONF_FILE. build_project.ps1 always includes this overlay
# since the hardware always has a display; it can be omitted for headless builds.
# APP_FEATURE_DISPLAY=y is passed as a CMake -D arg by build_project.ps1.

# ---------------------------------------------------------------------------
# Display driver + MIPI DBI interface (ST7789V)
# ---------------------------------------------------------------------------
CONFIG_MIPI_DBI=y
CONFIG_DISPLAY=y

# ---------------------------------------------------------------------------
# LVGL graphics library
# ---------------------------------------------------------------------------
CONFIG_LVGL=y

# LVGL memory pool — TinyTTF glyph buffers; one screen at a time.
# 56 KB (57344) overflows nrf52840 RAM by ~13 KB at link time with full feature set.
# 38,912 B was the nominal post-malloc-arena budget but the full feature set
# (2026-07-06) overflows by ~3.8 KB at that size — production ships 31,744 B.
# See docs/build/BUILD_STATUS.md before raising this value.
CONFIG_LV_Z_MEM_POOL_SIZE=28672

# LVGL draw layer buffer (8KB - reduced from 24KB default)
# 240x240 display doesn't need large layer buffers
CONFIG_LV_DRAW_LAYER_SIMPLE_BUF_SIZE=8192

# LVGL widgets used by UI screens
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_ARC=y
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_USE_BAR=y

# LVGL memory alignment (must match LV_DRAW_BUF_ALIGN for image data)
CONFIG_LV_ATTRIBUTE_MEM_ALIGN_SIZE=4

# Fonts: selected in prj.conf via APP_FONT_PROFILE_* (not here).
# RESOURCE_RUNTIME selects TinyTTF + RESOURCE_FONTS; SAFE_COMPILED selects Montserrat.

# LVGL display buffer (VDB) configuration
# VDB size: 20% of screen (240x240x2 * 20% * 2 buffers = ~46KB total)
CONFIG_LV_Z_VDB_SIZE=20
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_POINTER_INPUT=y
CONFIG_LV_COLOR_16_SWAP=y

# LVGL float support is disabled for this profile.
# App-level float formatting uses libc snprintf/LOG (independent of LVGL float observers).
CONFIG_LV_USE_FLOAT=n

# LVGL logging (ERROR + WARN messages)
CONFIG_LV_USE_LOG=y
CONFIG_LV_LOG_LEVEL_WARN=y
CONFIG_LV_LOG_PRINTF=y

# Widget naming (paths like measure/step_label) for lifecycle debug
CONFIG_LV_USE_OBJ_NAME=y

# Log every widget CREATE (explicit) and DELETE (LV_EVENT_DELETE) — disable for production
CONFIG_APP_UI_OBJ_LIFECYCLE_DEBUG=y

# LVGL memory allocation assertions (all disabled for production builds)
CONFIG_LV_USE_ASSERT_NULL=n
CONFIG_LV_USE_ASSERT_MALLOC=n
CONFIG_LV_USE_ASSERT_STYLE=n
CONFIG_LV_USE_ASSERT_MEM_INTEGRITY=n
CONFIG_LV_USE_ASSERT_OBJ=n
CONFIG_LV_USE_REFR_DEBUG=n
CONFIG_LV_USE_SYSMON=n
CONFIG_LV_USE_PERF_MONITOR=n

# ---------------------------------------------------------------------------
# Touch input (FT5336/FT6336) - polling mode to prevent queue overflow
# ---------------------------------------------------------------------------
CONFIG_INPUT=y
CONFIG_INPUT_FT5336=y
CONFIG_INPUT_FT5336_INTERRUPT=n
CONFIG_INPUT_FT5336_PERIOD=20

# SW1/SW2 use hcm,gpio-button in DT (app hw_button). Not Zephyr INPUT/gpio-keys.
CONFIG_INPUT_GPIO_KEYS=n

# Touch input queue (128 messages - increased to handle event bursts)
CONFIG_INPUT_QUEUE_MAX_MSGS=128

# ---------------------------------------------------------------------------
# Startup logo
# Logo is stored in external XIP flash (115 KB). Set =n to skip for faster boot.
# ---------------------------------------------------------------------------
CONFIG_UI_STARTUP_LOGO=y

# Button hold durations (PMIC KIN shutdown = 12 s per MAX20360 datasheet)
CONFIG_UI_POWER_LONG_PRESS_MS=12000
# Measure All / SW1 hold — 5 s countdown on the Measure screen progress bar
CONFIG_UI_MEASURE_LONG_PRESS_MS=5000

# ---------------------------------------------------------------------------
# UI Screen Selection
# Device Info is the home screen (carousel index 0) and is always enabled
# when display is on (CONFIG_UI_SCREEN_DEVICE_INFO, selected by
# APP_FEATURE_DISPLAY). It cannot be turned off independently.
# Glucose / HR / SpO2 screens are enabled by their APP_FEATURE_* umbrella.
# Storage screen: APP_FEATURE_FILE_SYSTEM (independent of USB).
# USB Transfer screen: APP_FEATURE_USB only.
# Measured cost of enabling all screens: +51 KB flash, +3 KB RAM.
# ---------------------------------------------------------------------------

# Power / regulator / Info diagnostic screens are off by default (shell + BLE).
# Charging screen is on: branded logo + SOC, auto-nav on USB plug.
CONFIG_UI_SCREEN_POWER=n
CONFIG_UI_SCREEN_REGULATOR=n
CONFIG_UI_SCREEN_CHARGER=y
CONFIG_UI_SCREEN_HOME_INFO=n
CONFIG_UI_SCREEN_RTC=n

# Standalone screens (no APP_FEATURE_* dependency).
# Measured incremental cost with SMP + SpO2 already enabled:
#   TEMPERATURE ~+5 KB, PROXIMITY ~+3 KB, BUZZER ~+2 KB, ACCEL ~+4 KB.
CONFIG_UI_SCREEN_TEMPERATURE=n
CONFIG_UI_SCREEN_PROXIMITY=n
CONFIG_UI_SCREEN_BUZZER=n
CONFIG_UI_SCREEN_ACCEL=n

# Per-screen RTT log levels (menuconfig: NiSense — UI module log levels).
# rtt_log.conf sets LOG_DEFAULT_LEVEL=4; new modules default to DBG unless overridden.
# Keep screen modules at INF (link fails ~+13 KB RAM if all are DBG). Bump individual
# modules to DBG here or in menuconfig while debugging a specific screen.
CONFIG_UI_OBJ_TRACK_LOG_LEVEL_DBG=y
CONFIG_UI_LOG_LEVEL_DBG=y
CONFIG_DEVICE_INFO_UI_LOG_LEVEL_INF=y
CONFIG_HOME_INFO_UI_LOG_LEVEL_INF=y
CONFIG_MEASURE_UI_LOG_LEVEL_INF=y
CONFIG_POWER_UI_LOG_LEVEL_INF=y
CONFIG_RTC_UI_LOG_LEVEL_INF=y
CONFIG_GLUCOSE_UI_LOG_LEVEL_INF=y
CONFIG_VITALS_UI_LOG_LEVEL_INF=y
CONFIG_VASCULAR_UI_LOG_LEVEL_INF=y
CONFIG_PPG_SAMPLE_UI_LOG_LEVEL_INF=y
CONFIG_TEMP_UI_LOG_LEVEL_INF=y
CONFIG_USB_UI_LOG_LEVEL_INF=y
CONFIG_STORAGE_UI_LOG_LEVEL_INF=y
CONFIG_PROXIMITY_UI_LOG_LEVEL_INF=y
CONFIG_BUZZER_UI_LOG_LEVEL_INF=y
CONFIG_WIFI_UI_LOG_LEVEL_INF=y
CONFIG_BLE_UI_LOG_LEVEL_INF=y
CONFIG_MAX32664_UPDATE_UI_LOG_LEVEL_INF=y
CONFIG_ACCEL_UI_LOG_LEVEL_INF=y
CONFIG_UI_SHELL_LOG_LEVEL_INF=y
CONFIG_UI_AGENT_LOG_LEVEL_INF=y
