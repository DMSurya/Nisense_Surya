# USB feature overlay — merged when CONFIG_APP_FEATURE_USB=y in prj.conf
# (also pulled automatically when APP_FEATURE_SHELL=y via Kconfig select).
#
# Owns all USBD-next + CDC-ACM (VCOM) Kconfig. Shell only adds Zephyr shell.
# Board DT already describes CDC UART + shell-uart chosen (64/65 overlayinc).

# ---------------------------------------------------------------------------
# USB device stack + CDC-ACM serial (VCOM)
# ---------------------------------------------------------------------------
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="NiSense"
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="AARMS"

# Quiet USB stack logs (RTT remains the log path when APP_FEATURE_RTT_LOG=y)
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_NRF_USBD_COMMON_LOG_LEVEL_WRN=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y

# UDC/USBD stacks — Zephyr defaults (UDC=512, USBD=1024) overflow under CDC
# enumerate traffic (faulting thread udc_nrfx).
CONFIG_UDC_NRF_THREAD_STACK_SIZE=1536
CONFIG_USBD_THREAD_STACK_SIZE=2048

# USB Device Controller buffer pools
CONFIG_UDC_BUF_COUNT=24
CONFIG_UDC_BUF_POOL_SIZE=6144

# Keep USB networking / MSC classes disabled (FatFS MSC path removed)
CONFIG_USB_DEVICE_NETWORK_ECM=n
CONFIG_USB_DEVICE_NETWORK_EEM=n
CONFIG_USB_DEVICE_NETWORK_RNDIS=n
CONFIG_USBD_MSC_CLASS=n
