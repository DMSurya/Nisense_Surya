# MAX3010x Standalone PPG Sensor feature overlay
# Enables the unified MAX3010x driver for MAX30101, MAX30102, MAX30105 sensors
# connected directly to the nRF I2C bus (Pulse product path).
#
# Product SKU (Watch vs Pulse) is selected at runtime by product_hw_detect(),
# not by enabling this feature alone. On the unified image this feature is
# enabled together with APP_FEATURE_MAX32664 so either board can boot:
#   Watch: MAX32664C + MAX86141
#   Pulse: MAX3010x direct and/or MAX32664D hub
#
# Applied via EXTRA_CONF_FILE when enabling APP_FEATURE_MAX3010X.
# APP_FEATURE_MAX3010X=y is passed as a CMake -D arg by build_project.ps1.
#
# Sensor variant is auto-detected from DT compatible string:
#   "maxim,max30101-ppg" -> MAX30101 (3 LEDs: Red + IR + Green)
#   "maxim,max30102-ppg" -> MAX30102 (2 LEDs: Red + IR)
#   "maxim,max30105-ppg" -> MAX30105 (3 LEDs: Red + IR + Green, particle variant)

# ---------------------------------------------------------------------------
# MAX3010x unified driver (MAX30101 / MAX30102 / MAX30105)
# ---------------------------------------------------------------------------
CONFIG_MAX3010X_PPG=y

# Disable the old standalone MAX30101-only driver (superseded by MAX3010X_PPG)
CONFIG_MAX30101=n
