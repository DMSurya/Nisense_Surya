# RTT logging feature-specific configuration overlay
# Applied via EXTRA_CONF_FILE when enabling APP_FEATURE_RTT_LOG.
# Keeps RTT console/log backend and module log levels out of baseline builds.

# Core logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_FMT_SECTION=y

# RTT console + log backend
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_BUFFER=0

# SEGGER RTT buffers (channel 0 = LOG; channel 1 reserved for SystemView)
CONFIG_SEGGER_RTT_MAX_NUM_UP_BUFFERS=3
CONFIG_SEGGER_RTT_MAX_NUM_DOWN_BUFFERS=3
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=2048
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=32
CONFIG_SEGGER_RTT_MODE_NO_BLOCK_SKIP=y
CONFIG_SEGGER_RTT_SECTION_CUSTOM=y
CONFIG_SEGGER_RTT_SECTION_CUSTOM_NAME=".rtt_buff_data"
CONFIG_SEGGER_RTT_INIT_MODE_ALWAYS=y

# Module log levels
CONFIG_KERNEL_LOG_LEVEL_INF=y
CONFIG_MPU_LOG_LEVEL_INF=y
CONFIG_RESOURCE_LOG_LEVEL=3
CONFIG_CALIBRATION_LOG_LEVEL=3
CONFIG_GPIO_LOG_LEVEL_WRN=y
CONFIG_SPI_LOG_LEVEL_WRN=y
CONFIG_DISPLAY_LOG_LEVEL_WRN=y
CONFIG_INPUT_LOG_LEVEL_INF=y
CONFIG_REGULATOR_LOG_LEVEL_WRN=y
CONFIG_COUNTER_LOG_LEVEL_INF=y
CONFIG_I2C_LOG_LEVEL_WRN=y
