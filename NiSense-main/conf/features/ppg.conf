# PPG measurement pipeline feature overlay
# Configures the on-chip PPG algorithm subsystem (subsys/ppg_algo).
# Requires at least one PPG sensor source: APP_FEATURE_MAX32664 or APP_FEATURE_MAX3010X.
#
# Applied via EXTRA_CONF_FILE when enabling APP_FEATURE_PPG.
# APP_FEATURE_PPG=y is passed as a CMake -D arg by build_project.ps1.
# HR and SpO2 sub-features are enabled separately via APP_FEATURE_HR / APP_FEATURE_SPO2.

# ---------------------------------------------------------------------------
# PPG algorithm workqueue
# Dedicated workqueue keeps sensor sampling off the system workqueue,
# preventing contention with BLE/USB/Wi-Fi event handling.
# ---------------------------------------------------------------------------
CONFIG_PPG_ALGO_DEDICATED_WORKQUEUE=y
CONFIG_PPG_ALGO_WORKQUEUE_STACK_SIZE=3072

# ---------------------------------------------------------------------------
# Algorithm parameters
# RAW-mode: MAX32664/MAX86141 at 25 Hz; MAX3010x at 50 Hz (decimated to 25).
# RESP=y requires BUFFER ≥20 s (ppg_resp_calc BUILD_ASSERT). Set both here so
# a stale build .config cannot leave BUFFER=12 with RESP on.
# Full algo test: HB/BP on (experimental). HRV on. Window = 20 s → 500 @ 25 Hz.
# BUGFIX: reverted from 32s/800 samples back to 20s/500 — explicitly not
# wanted, and the buffer array (PPG_MAX_SAMPLES=800) still has headroom if
# ever revisited later, but the real acquisition length stays 500 samples.
# ---------------------------------------------------------------------------
CONFIG_PPG_ALGO_SAMPLE_RATE=25
CONFIG_PPG_ALGO_BUFFER_SECONDS=20
CONFIG_APP_HEALTH_PPG_SECONDS=20
CONFIG_PPG_ALGO_QUALITY_THRESHOLD=50
# Motion rejection ON: host pairs PPG @ 25 Hz with LIS2DS12 (direct or via
# hub Family 0x12 / external feeder @ CONFIG_MAX32664_EXTERNAL_ACCEL_FEED_RATE_HZ=25).
# Rates must stay matched — do not change SAMPLE_RATE without the feeder Hz.
CONFIG_PPG_ALGO_MOTION_REJECTION=y
CONFIG_PPG_PROX_GUARD_ENABLE=y
CONFIG_PPG_PROX_ABORT_MISS_SAMPLES=5

CONFIG_PPG_ALGO_HB_ENABLED=y
CONFIG_PPG_ALGO_RESP_ENABLED=y
CONFIG_PPG_ALGO_BP_ENABLED=y
CONFIG_PPG_ALGO_HRV_ENABLED=y
CONFIG_PPG_ALGO_DC_WINDOW_SAMPLES=32
# Staged live: early Vitals (~300), Vascular/record at full window (500).
# Live tail 0 — watch required count is enough; keeps SFH LEDs off after done.
CONFIG_PPG_ALGO_STAGED_LIVE=y
CONFIG_PPG_ALGO_PARTIAL_VITALS_SAMPLES=300
CONFIG_PPG_ALGO_LIVE_TAIL_SAMPLES=0

# ---------------------------------------------------------------------------
# Debug / shell (off by default)
# ---------------------------------------------------------------------------
CONFIG_PPG_ALGO_DEBUG_LOGGING=n
# Retain IR/Red/Green DC+AC in sample buffer for NOR PPG_RAW chunks
CONFIG_PPG_LOG_DC_AC=y
# PPG_ALGO_SHELL is centralized in conf/features/shell.conf

# ---------------------------------------------------------------------------
# UI screens
# APP_FEATURE_PPG auto-selects UI_SCREEN_VITALS and UI_SCREEN_VASCULAR;
# PPG_SAMPLE must be explicit.
#
# PPG_SAMPLE is the raw IR/Red/Green waveform screen — a bring-up/debug tool,
# not a product surface. The same per-sample raw data streams over BLE
# (CONFIG_BLE_PPG_STREAMING=y in conf/features/ble.conf), so the desktop app is
# the place to inspect waveforms. Keep it off the on-device carousel by default;
# set =y temporarily for sensor bring-up.
# ---------------------------------------------------------------------------
CONFIG_UI_SCREEN_PPG_SAMPLE=n
