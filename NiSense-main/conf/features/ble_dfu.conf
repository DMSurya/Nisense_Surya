# BLE DFU feature overlay — MCUmgr SMP-over-BLE image upload
# Applied by build_project.ps1 when APP_FEATURE_BLE_DFU=y.
# Overrides the =n defaults set in conf/core/bootloader.conf.

# ---------------------------------------------------------------------------
# MCUmgr core + image management
# ---------------------------------------------------------------------------
# These three are disabled by default in bootloader.conf to avoid linking
# MCUboot libraries into the app when DFU is not needed.  Enabling them here
# (later in the conf merge order) overrides those =n values.
# MCUMGR depends on ZCBOR for CBOR encode/decode; it is NOT auto-selected, so
# enable it explicitly or the whole MCUmgr stack is silently dropped.
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y

# ---------------------------------------------------------------------------
# Flash streaming write (required for IMG upload to secondary slot)
# ---------------------------------------------------------------------------
CONFIG_STREAM_FLASH=y
CONFIG_STREAM_FLASH_ERASE=y

# ---------------------------------------------------------------------------
# SMP BLE transport
# ---------------------------------------------------------------------------
# Exposes the Nordic SMP service (UUID 8D53DC1D-…) so the companion app can
# use the MCUmgr protocol to upload images over BLE.
CONFIG_MCUMGR_TRANSPORT_BT=y

# Reassemble SMP frames that span multiple BLE ATT PDUs (needed when image
# chunks are split across BLE connection events at DLE 251-byte boundaries).
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y

# During SMP image upload, request a short connection interval from the
# central (Android / iOS). Free throughput win with no extra RAM cost.
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y

# Larger SMP netbufs let the companion send ~1.2–1.4 KB image data per
# request (fragmented across several ATT Write-Without-Response packets).
# Default 384 B forces ~220 B chunks and thousands of round-trips for a
# 1.5 MB image. 1536 × 4 ≈ 6 KB static — fits the nRF52840 RAM budget.
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=1536
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=4
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096

# Gate the SMP characteristic behind an *authenticated* (MITM/passkey) link
# via the MCUMGR_TRANSPORT_BT_PERM choice.  This is the secure default when
# BT_SMP=y.  The device displays a 6-digit passkey on its LCD (numeric
# comparison); the companion app must complete passkey pairing before it can
# read/write the SMP characteristic — otherwise reads/writes fail with
# "The attribute requires authentication before it can be read or written".
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_AUTHEN=y

# ---------------------------------------------------------------------------
# MCUmgr command groups
# ---------------------------------------------------------------------------
# Image group: upload, list slots, set pending (confirm=false), erase
CONFIG_MCUMGR_GRP_IMG=y

# Device-side OTA progress: mgmt notification hooks (DFU started/pending/…).
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y

# OS group: reset command — companion sends this after upload to trigger
# MCUboot swap on next boot.
CONFIG_MCUMGR_GRP_OS=y

# ---------------------------------------------------------------------------
# Log levels
# ---------------------------------------------------------------------------
# STREAM_FLASH at DBG emits one line per image chunk which floods the 4 KB
# RTT buffer and causes dropped messages. Keep it at WRN; IMG_MANAGER at INF
# still logs start/complete/hash/pending.
CONFIG_STREAM_FLASH_LOG_LEVEL_WRN=y
CONFIG_IMG_MANAGER_LOG_LEVEL_INF=y
