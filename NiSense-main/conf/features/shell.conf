# Shell feature overlay — merged when CONFIG_APP_FEATURE_SHELL=y in prj.conf.
#
# Shell-only. Transport is APP_FEATURE_USB (selected automatically by Kconfig
# when shell is enabled; conf/features/usb.conf). Board DT provides the CDC
# UART node and zephyr,shell-uart binding.

# ---------------------------------------------------------------------------
# Zephyr shell core (serial backend → CDC VCOM)
# ---------------------------------------------------------------------------
CONFIG_SHELL=y
# Minimal shell: drop help/history/tab/wildcard/kernel cmds — needed for
# FLASH budget when USB CDC + full app features are enabled (~7 KB class).
CONFIG_SHELL_MINIMAL=y
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_SHELL_CMD_BUFF_SIZE=256
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_RTT=n
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y
CONFIG_SHELL_PROMPT_UART="NiSense:~$ "

# ---------------------------------------------------------------------------
# Subsystem shell controls (centralized)
# ---------------------------------------------------------------------------
CONFIG_PPG_ALGO_SHELL=n
