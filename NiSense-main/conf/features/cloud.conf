# Cloud telemetry overlay — MQTT publish of vitals/glucose when Wi-Fi is up.
# Applied automatically when CONFIG_APP_FEATURE_CLOUD_TELEMETRY=y (CMake also
# enables conf/features/wifi.conf).
#
# Production: keep CONFIG_BLE_SECURITY_PROFILE_SECURE=y (default in ble.conf).
# WiFi credentials are provisioned over L3-authenticated BLE.
#
# Enable in prj.conf:
#   CONFIG_APP_FEATURE_CLOUD_TELEMETRY=y
# Or pass -DCONFIG_APP_FEATURE_CLOUD_TELEMETRY=y to west build.

CONFIG_APP_FEATURE_CLOUD_TELEMETRY=y
