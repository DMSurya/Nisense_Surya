# Feature overlay: Glucose
# Use with: west build ... -- -DEXTRA_CONF_FILE=conf/features/glucose.conf
#
# Both wearable and pulse calibration models stay in the clinical Model pack
# on NOR. product_hw_detect() selects the active GMDL entry at boot.

# Peak 3760/4096 (91%) after matrix calc; +1 KB for margin
CONFIG_GLUCOSE_SENSOR_WORKQ_STACK_SIZE=5120
# Matrices: XIP NOR (CONFIG_GLUCOSE_MATRICES_FROM_XIP defaults y in Kconfig)
CONFIG_GLUCOSE_UI_THREAD_STACK_SIZE=1536
CONFIG_GLUCOSE_ALGORITHM_LOG_LEVEL_WRN=y
