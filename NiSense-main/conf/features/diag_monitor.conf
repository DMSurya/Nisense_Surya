# Feature overlay: Diagnostics monitor (live heap/stack/LVGL dumps over RTT).
# Master: CONFIG_APP_FEATURE_DIAG_MONITOR in prj.conf (or -D on west command line).
# CMakeLists appends this file only when the master is y.
# Kconfig tuning symbols: Kconfig.diag_monitor.
#
# Tuning-only: adds ~110 KB flash (mostly CONFIG_DEBUG_OPTIMIZATIONS) and ~2.5 KB RAM.
# See docs/debugging/MEMORY_TUNING.md and docs/build/BUILD_STATUS.md.

# Reinforce Kconfig select; keep kernel auto-dump thread off (diag_monitor owns cadence).
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=n

# --- Compiler + thread instrumentation (Ozone / analyzer) ---
# Preserve debug info and optimize for debugging
CONFIG_DEBUG_OPTIMIZATIONS=y

# Thread introspection (stack info, monitor, names, init pattern)
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_INIT_STACKS=y

# Per-thread CPU accounting (lighter than SCHED_THREAD_USAGE_ALL)
CONFIG_SCHED_THREAD_USAGE=y

# System heap runtime stats (used, peak, free) — read by diag_monitor.c
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# Synchronised printk to avoid interleaved output during dumps
CONFIG_PRINTK_SYNC=y

# Smaller monitor thread — thread_analyzer_print runs here, not on main
CONFIG_DIAG_MONITOR_STACK_SIZE=1536
CONFIG_DIAG_MONITOR_INTERVAL_SEC=5

# LVGL pool matches display.conf production default (31,744 B).
# diag_monitor.conf is merged only when this feature is on; repeat here so
# tuning builds stay self-contained if display.conf pool is raised later.
CONFIG_LV_Z_MEM_POOL_SIZE=31744

