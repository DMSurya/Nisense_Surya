# Core overlay: MAX20360 PMIC subsystems
# Always included by build_project.ps1 (not optional).
# Do NOT add APP_FEATURE_* toggles here — core settings only.

# Regulator subsystem
CONFIG_REGULATOR=y
CONFIG_REGULATOR_MAX20360=y

# Charger subsystem
CONFIG_CHARGER=y
CONFIG_CHARGER_MAX20360=y

# Fuel gauge subsystem (MAX17620-compatible gauge on MAX20360 PMIC, I2C 0x36)
CONFIG_FUEL_GAUGE=y
CONFIG_FUEL_GAUGE_MAX20360=y
CONFIG_FUEL_GAUGE_MAX20360_LOG_LEVEL_INF=y
