# Core overlay: on-board sensors, ADC, and RTC
# Always included by build_project.ps1 (not optional).
# Do NOT add APP_FEATURE_* toggles here — core settings only.

# Hardware info (device ID, reset reason)
CONFIG_HWINFO=y
CONFIG_HWINFO_NRF=y

# ADC for INA122UA instrumentation amplifier
CONFIG_ADC_NRFX_SAADC=y

# Sensor framework
CONFIG_SENSOR=y

# VCNL3040 Proximity Sensor
CONFIG_VCNL3040=y

# MAX302xx Body Sensor Driver (MAX30205/MAX30208/MAX30210 auto-detected)
CONFIG_MAX302XX=y
CONFIG_MAX302XX_TRIGGER_GLOBAL_THREAD=y
CONFIG_MAX302XX_LOG_LEVEL_INF=y

# Note: GLUCOSE_SENSOR auto-selected by APP_FEATURE_GLUCOSE (see Kconfig)

# MCP7940N RTC driver
CONFIG_COUNTER_MCP79XX=y

# RTC API support - calendar-based time operations
CONFIG_RTC=y
CONFIG_RTC_ALARM=y
CONFIG_RTC_CALIBRATION=y
