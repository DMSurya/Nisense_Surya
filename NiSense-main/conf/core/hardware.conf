# Core overlay: essential hardware bus drivers
# Always included by build_project.ps1 (not optional).
# Do NOT add APP_FEATURE_* toggles here — core settings only.

CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_COUNTER=y
CONFIG_FLASH=y
CONFIG_PWM=y

# Note: Large I2C transfers (>255 bytes) for MAX32664 firmware update
# are enabled via device tree property: zephyr,concat-buf-size = <8320>;
# in the I2C1 node (boards/raytac_mdbt50q_db_40_nrf52840.overlay)
