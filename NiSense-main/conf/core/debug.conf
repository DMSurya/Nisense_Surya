# Core overlay: debug console and printf configuration
# Always included by build_project.ps1 (not optional).
# Do NOT add APP_FEATURE_* toggles here — core settings only.

# Disable UART console — RTT is the primary debug path
CONFIG_UART_CONSOLE=n

# Float printf support (needed for sensor value formatting)
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_CBPRINTF_FP_A_SUPPORT=y
