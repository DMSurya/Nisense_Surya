# Core overlay: flash, NVS, settings, QSPI, and XIP storage
# Always included by build_project.ps1 (not optional).
# Do NOT add APP_FEATURE_* toggles here — core settings only.

# NVS for configuration storage
# Settings subsystem (required for BLE bond persistence)
CONFIG_NVS=y
CONFIG_NVS_INIT_BAD_MEMORY_REGION=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# QSPI flash enabled via device tree (MX25R6435F 8MB at 32MHz)
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_NORDIC_QSPI_NOR_STACK_WRITE_BUFFER_SIZE=16

# Resource store (QSPI mmap) for logos/fonts/icons (logos, fonts, icons)
# Assets stored in resource_primary partition (0x0F6000, 512 KB)
# Memory-mapped at QSPI base 0x12000000 + 0x0F6000 = 0x120F6000
CONFIG_RESOURCE=y

# Calibration data (production-locked, read-only)
# Stored in calibration partition (0x2F6000, 64 KB)
CONFIG_CALIBRATION=y
