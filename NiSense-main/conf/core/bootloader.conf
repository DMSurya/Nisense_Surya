# Core overlay: MCUboot bootloader + partition management
# Always included by build_project.ps1 (not optional).
# Do NOT add APP_FEATURE_* toggles here — core settings only.

# Boot timing and banner
CONFIG_BOOT_DELAY=0
CONFIG_NCS_BOOT_BANNER=n

# MCUboot secure bootloader with OTA support
CONFIG_BOOTLOADER_MCUBOOT=y
# FLASH_LOAD_OFFSET and FLASH_LOAD_SIZE are auto-derived by sysbuild from the
# slot0_partition DTS node (offset=0xa000, size=0xf2000 - 0x200 header = 0xf1e00)

# Disable DFU/image management by default (saves ~12 KB flash + ~4 KB RAM).
# NOTE: conf/features/ble_dfu.conf overrides these to =y when the
#       APP_FEATURE_BLE_DFU feature is enabled — conf files are merged in order
#       (core first, features last), so the feature overlay always wins.
CONFIG_IMG_MANAGER=n
CONFIG_MCUBOOT_IMG_MANAGER=n
CONFIG_MCUMGR=n
