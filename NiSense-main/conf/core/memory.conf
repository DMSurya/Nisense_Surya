# Core overlay: memory, stack, and heap configuration
# Always included by build_project.ps1 (not optional).
# Do NOT add APP_FEATURE_* toggles here — core settings only.

CONFIG_FPU=y

# Stack sizes for BLE peripheral + LVGL operations
# LVGL refresh requires ~1280 bytes call depth + overhead
# Main stack needs extra space for LVGL + sensor init + UI creation
# diag_monitor: 5776 B peak @ init + UI nav (94%); target ~25% headroom
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_IDLE_STACK_SIZE=512
CONFIG_ISR_STACK_SIZE=3072
CONFIG_MPSL_WORK_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3584

# Main heap
# Diag-monitor observed peak: ~10-14 KB during a full glucose run.
# 28 KB still leaves ~2x margin after funding Wi-Fi STA+HTTP bulk sync.
CONFIG_HEAP_MEM_POOL_SIZE=28672
CONFIG_KERNEL_MEM_POOL=y

# Stale-build guard: diag monitor sets THREAD_ANALYZER + AUTO in
# conf/features/diag_monitor.conf when CONFIG_APP_FEATURE_DIAG_MONITOR=y.
# Keep AUTO off in all builds so a leftover THREAD_ANALYZER=y never spawns
# the kernel auto-dump thread when the feature is disabled.
CONFIG_THREAD_ANALYZER_AUTO=n

# Picolibc malloc: default (-1) uses "remaining RAM after _end", which is ~0 B on
# full NiSense builds → SYS_INIT(malloc_prepare) BusFaults before RTT/main.
# Static 4 KB arena (FatFS ff_memalloc); funded by matching LVGL pool reduction.
# RAM budget: docs/build/BUILD_STATUS.md, docs/debugging/MEMORY_TUNING.md
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=4096

# --- Right-sized application thread stacks (see Kconfig: "NiSense — thread
#     stack tuning"). Values picked from CONFIG_APP_FEATURE_DIAG_MONITOR high-watermark
#     data: every thread stays below 60% of the new stack with margin. ---
# LED status thread also calls into I2C/logging paths; bump stack to reduce
# risk of return-address corruption under combined LED+sensor activity.
CONFIG_LED_STATUS_THREAD_STACK_SIZE=2048
