# =============================================================================
# MCUboot Bootloader Configuration (Root Level)
# =============================================================================
# NOTE: With sysbuild, the primary MCUboot config is in sysbuild/mcuboot/prj.conf
# This file may be used for non-sysbuild builds or as a fallback.
# =============================================================================

# CRITICAL: Allow MCUboot to boot an image without confirmed trailer
# This is ESSENTIAL for first boot after flashing via J-Link/Ozone!
CONFIG_BOOT_BOOTSTRAP=y

# Validate primary slot
CONFIG_BOOT_VALIDATE_SLOT0=y

# RTT Console - MUST MATCH prj.conf buffer sizes for seamless handoff
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_SEGGER_RTT_MODE_NO_BLOCK_SKIP=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y

# Flash support
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# Size optimization
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_BOOT_MAX_IMG_SECTORS=128
CONFIG_ASSERT=n
CONFIG_MCUBOOT_INDICATION_LED=n
CONFIG_BOOT_WATCHDOG_FEED=y
